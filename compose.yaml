x-hms-app-build: &hms-app-build
    context: ./vendor/laravel/sail/runtimes/8.2
    dockerfile: Dockerfile
    args:
        WWWGROUP: '${WWWGROUP:-1000}'

services:
    hms:
        build: *hms-app-build
        image: hms-saas-8.2/app
        depends_on:
            mysql:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${HMS_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            APP_URL: 'http://127.0.0.1:${HMS_PORT:-8000}'
            DB_HOST: '${DB_HOST}'
            DB_PORT: '${DB_PORT:-3306}'
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail

    hospital-api:
        build: *hms-app-build
        image: hms-saas-8.2/app
        depends_on:
            mysql:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${HOSPITAL_API_PORT:-8001}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            APP_ENV: production
            APP_DEBUG: true
            APP_URL: 'http://127.0.0.1:${HOSPITAL_API_PORT:-8001}'
            DB_HOST: '${DB_HOST}'
            DB_PORT: '${DB_PORT:-3306}'
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/hospital-api/artisan serve --host=0.0.0.0 --port=80'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail

    gangnamunni:
        build: *hms-app-build
        image: hms-saas-8.2/app
        depends_on:
            mysql:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${GANGNAMUNNI_PORT:-8002}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            PHP_CLI_SERVER_WORKERS: '${GANGNAMUNNI_WORKERS:-8}'
            G5_PG_PAYMENTS_ENABLED: '${G5_PG_PAYMENTS_ENABLED:-0}'
            BOOKING_PAYMENT_PREVIEW_ENABLED: '${BOOKING_PAYMENT_PREVIEW_ENABLED:-1}'
            BOOKING_PAYMENT_BASE_URL: '${BOOKING_PAYMENT_BASE_URL:-}'
            PORTONE_IMP_CODE: '${PORTONE_IMP_CODE:-}'
            PORTONE_API_KEY: '${PORTONE_API_KEY:-}'
            PORTONE_API_SECRET: '${PORTONE_API_SECRET:-}'
            PORTONE_SANDBOX: '${PORTONE_SANDBOX:-1}'
            PORTONE_CHANNEL_CARD: '${PORTONE_CHANNEL_CARD:-}'
            PORTONE_CHANNEL_BANK: '${PORTONE_CHANNEL_BANK:-}'
            PORTONE_CHANNEL_NAVERPAY: '${PORTONE_CHANNEL_NAVERPAY:-}'
            PORTONE_CHANNEL_KAKAOPAY: '${PORTONE_CHANNEL_KAKAOPAY:-}'
            PORTONE_CHANNEL_TOSSPAY: '${PORTONE_CHANNEL_TOSSPAY:-}'

            G5_MYSQL_HOST: '${DB_HOST}'
            G5_MYSQL_PORT: '${DB_PORT:-3306}'
            G5_MYSQL_USER: '${DB_USERNAME}'
            G5_MYSQL_PASSWORD: '${DB_PASSWORD}'
            G5_MYSQL_DB: '${DB_DATABASE}'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS -S 0.0.0.0:80 -t /var/www/html/hairwang_full /var/www/html/hairwang_full/local-router.php'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail

    mysql:
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-3308}:3306'
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        command:
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_unicode_ci'
        volumes:
            - 'sail-mysql-local:/var/lib/mysql'
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql-local:
        driver: local
