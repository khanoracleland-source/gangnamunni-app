<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>API Test</title>
</head>
<body>
    <h1>API 연결 테스트</h1>
    <button onclick="testAPI()">API 테스트</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'API 호출 중...';

            try {
                const url = 'http://localhost:8080/api/hospitals?page=1&per_page=5&sort_by=rating&sort_order=desc';
                console.log('Request URL:', url);

                const response = await fetch(url);
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Response data:', data);

                resultEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error:', error);
                resultEl.textContent = `에러 발생:\n\n${error.message}\n\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
